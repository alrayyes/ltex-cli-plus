# Builds the image on every pull request (catches a broken Dockerfile before
# merge) and pushes it to ghcr.io on push to main - the only two events that
# change what the image contains, since there's no other code here to lint.
name: build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # packages: write and the two below are only needed on the
      # push-to-main path, but granting them here is simpler than a second
      # job with its own checkout and build step.
      packages: write
      id-token: write # mints the Sigstore OIDC token the attestation is signed with
      attestations: write # publishes the attestation to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: hadolint
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/.hadolint.yaml" \
            hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 \
            < Dockerfile

      - name: Read the pinned LTeX version
        id: version
        run: |
          version=$(grep -m1 '^ARG LTEX_VERSION=' Dockerfile | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pull request builds without pushing, so a broken Dockerfile fails
      # the check without publishing anything.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/alrayyes/ltex-cli-plus:${{ steps.version.outputs.version }}
            ghcr.io/alrayyes/ltex-cli-plus:latest

      # SLSA Build L2: a signed, Sigstore-backed attestation tying this
      # exact image digest to this workflow run. Provenance, not signing -
      # the image itself isn't cosign-signed, a separate decision left for
      # whenever a real consumer verifies one.
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/alrayyes/ltex-cli-plus
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
